name: "haiku-ci"
on: [push, pull_request]

jobs:
  build-haiku-r1beta6:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: build-haiku-r1beta6-x86-64

    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - uses: actions/checkout@v4

      - name: Start Haiku R1/beta6
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: haiku
          version: 'r1beta6'
          architecture: 'x86-64'

      - name: Build package
        run: |
          pkgman update -y cmd:gcc makefile_engine gcc_syslibs_devel
          packaging/build-hpkg.sh

  build-haiku-nightly:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: build-haiku-nightly-x86-64

    steps:
      - uses: actions/checkout@v4

      - uses: korli/action@v0.25.0-haiku4
        with:
          operating_system: haiku
          version: nightly
          architecture: 'x86-64'
          run: |
            ssh user@localhost "pkgman update -y cmd:gcc makefile_engine gcc_syslibs_devel" &&
            packaging/build-hpkg.sh
